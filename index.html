// ===== API CLIENT =====
async function apiCall(action, payload = {}, method = 'GET') {
  try {
    let url = API_URL;
    const options = { method };
    if (method === 'GET') {
      const params = new URLSearchParams({ key: API_KEY, action, ...payload });
      url += '?' + params.toString();
      options.redirect = 'follow';
    } else {
      options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
      options.body = JSON.stringify({ key: API_KEY, action, payload });
      options.redirect = 'follow';
    }
    const res = await fetch(url, options);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'API error');
    return json.data;
  } catch (err) {
    console.error('[API]', action, err);
    throw err;
  }
}

function shuffleOptions(q) {
  const indices = [0,1,2,3].sort(() => Math.random() - 0.5);
  const newOptions = indices.map((i) => q.options[i]);
  const newCorrect = indices.indexOf(q.correct);
  return { ...q, options: newOptions, correct: newCorrect };
}

function getLocalQuestions(subject, track, n) {
  const pool = FALLBACK_QUESTIONS.filter((q) => q.subject === subject && q.track === track);
  return [...pool].sort(() => Math.random() - 0.5).slice(0, n).map(shuffleOptions);
}

  const container = document.getElementById('toast-container');

  toast.textContent = `${icons[type]} ${message}`;

    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-20px)';
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

function playSound(type = 'click') {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const playTone = (freq, start, duration, wave = 'sine', volume = 0.15) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = wave;
      osc.frequency.setValueAtTime(freq, now + start);
      gain.gain.setValueAtTime(volume, now + start);
      gain.gain.exponentialRampToValueAtTime(0.001, now + start + duration);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + start); osc.stop(now + start + duration);
    };
    if (type === 'click') playTone(600, 0, 0.08, 'sine', 0.08);
    else if (type === 'tick') playTone(1000, 0, 0.03, 'square', 0.05);
    else if (type === 'win') [523.25,659.25,783.99,1046.5].forEach((f,i) => playTone(f, i*0.12, 0.2, 'sine', 0.18));
    setTimeout(() => ctx.close(), 2000);
  } catch (e) {}
}

function playCorrectSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const playNote = (freq, start, duration, volume = 0.15) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + start);
      gain.gain.setValueAtTime(volume, now + start);
      gain.gain.exponentialRampToValueAtTime(0.001, now + start + duration);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + start); osc.stop(now + start + duration);
    };
    playNote(1046.5, 0, 0.15, 0.2);
    playNote(1318.5, 0.12, 0.25, 0.2);
    playNote(2093, 0, 0.1, 0.08);
    playNote(2637, 0.12, 0.15, 0.08);
    setTimeout(() => ctx.close(), 1500);
  } catch (e) {}
}

function playWrongSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(120, now + 0.45);
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1200, now);
    filter.frequency.exponentialRampToValueAtTime(400, now + 0.45);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.setValueAtTime(0.18, now + 0.35);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
    osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.5);
    setTimeout(() => ctx.close(), 1000);
  } catch (e) {}
}

function showConfirm(title, message, okText = 'Đồng ý', cancelText = 'Hủy') {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4';
    overlay.innerHTML = `
      <div class="bg-white rounded-3xl shadow-2xl p-6 max-w-sm w-full text-center animate-pop">

          <button id="confirm-cancel" class="bg-gray-200 text-gray-700 font-bold py-3 rounded-2xl hover:bg-gray-300 transition">${cancelText}</button>
          <button id="confirm-ok" class="bg-gradient-to-r from-brand-500 to-brand-700 text-white font-bold py-3 rounded-2xl hover:scale-105 transition">${okText}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const cleanup = (result) => {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity 0.2s';
      setTimeout(() => overlay.remove(), 200);
      resolve(result);
    };
    overlay.querySelector('#confirm-ok').addEventListener('click', () => { playSound('click'); cleanup(true); });
    overlay.querySelector('#confirm-cancel').addEventListener('click', () => { playSound('click'); cleanup(false); });
    overlay.addEventListener('click', (e) => { if (e.target === overlay) cleanup(false); });
  });
}

function initLoginEvents() {
  const roleBtns = document.querySelectorAll('.role-btn');
  const roleInput = document.getElementById('role-input');
  const togglePwd = document.getElementById('toggle-password');
  const pwdInput = document.getElementById('password-input');
  const loginBtn = document.getElementById('login-btn');
  const loginBtnText = document.getElementById('login-btn-text');
  const errorBox = document.getElementById('login-error');
  const errorText = document.getElementById('login-error-text');

  roleBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      playSound('click');
      roleBtns.forEach((b) => {
        b.classList.remove('role-active','bg-brand-500','text-white','border-brand-500');
        b.classList.add('bg-white','text-brand-600','border-brand-200');
      });
      btn.classList.add('role-active','bg-brand-500','text-white','border-brand-500');
      btn.classList.remove('bg-white','text-brand-600','border-brand-200');
      state.selectedRole = btn.dataset.role;
      roleInput.value = btn.dataset.role;
      errorBox.classList.add('hidden');
    });
  });

  togglePwd.addEventListener('click', () => {
    playSound('click');
    const isPwd = pwdInput.type === 'password';
    pwdInput.type = isPwd ? 'text' : 'password';
    togglePwd.textContent = isPwd ? '🙈' : '👁️';
  });

  loginBtn.addEventListener('click', handleLogin);
  [document.getElementById('username-input'), pwdInput].forEach((el) => {
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
  });

  async function handleLogin() {
    const username = document.getElementById('username-input').value.trim().toLowerCase();
    const password = pwdInput.value.trim();
    const role = state.selectedRole;
    errorBox.classList.add('hidden');

    if (!username || !password) {
      errorText.textContent = 'Vui lòng nhập đầy đủ!';
      errorBox.classList.remove('hidden');
      playSound('click');
      return;
    }

    loginBtn.disabled = true;
    loginBtnText.innerHTML = '<div class="spinner" style="width:24px;height:24px;border-width:3px;"></div>';

    let user = null;
    try {
      if (state.isOnline) {
        const data = await apiCall('login', { username, password });
        if (data.user) user = data.user;
      }
    } catch (err) { console.warn('[Login]', err); }

    if (!user) {
      const localUser = FALLBACK_USERS.find((u) => u.username === username && u.password === password);
      if (localUser) { const { password: _, ...rest } = localUser; user = rest; }
    }

    loginBtn.disabled = false;
    loginBtnText.textContent = '🚀 Vào chơi!';

    if (!user) {
      errorText.textContent = 'Sai tên hoặc mật khẩu!';
      errorBox.classList.remove('hidden');
      playSound('click');
      return;
    }

    if (user.role !== 'admin' && user.role !== role) {
      errorText.textContent = `Tài khoản này là "${user.role}"!`;
      errorBox.classList.remove('hidden');
      playSound('click');
      return;
    }

    playSound('win');
    state.currentUser = user;
    showToast(`Chào ${user.display_name}! 🎉`, 'success');

    setTimeout(() => {
      if (user.role === 'student') renderStudentHome();
      else if (user.role === 'parent') renderParentHome();
      else renderAdminHome();
    }, 500);
  }
}
